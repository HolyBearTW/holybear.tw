name: Update TMS character references

on:
  schedule:
    - cron: '20 19 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: update-tms-radar-reference
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Generate TMS radar curves and alias index
        env:
          VITE_NEXON_API_KEY: ${{ secrets.VITE_NEXON_API_KEY }}
        run: node scripts/generate-tms-radar-reference.mjs

      - name: Commit refreshed character references
        id: commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .vitepress/theme/maplestory/data/tmsRadarReference.json .vitepress/theme/maplestory/data/tmsAliasIndex.json
          if git diff --cached --quiet; then
            echo "Character references are unchanged."
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git commit -m "chore: refresh TMS character references"
          git pull --rebase origin main
          git push origin HEAD:main
          echo "changed=true" >> "$GITHUB_OUTPUT"

      - name: Deploy refreshed static site
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy-vitepress.yml --ref main
